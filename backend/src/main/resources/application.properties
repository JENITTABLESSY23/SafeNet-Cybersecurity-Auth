# ── Server ───────────────────────────────────────────────────
# PORT is set automatically by cloud hosts (Render, Heroku, etc.) — falls
# back to 8080 for local runs where nothing sets that env var.
server.port=${PORT:8080}
spring.application.name=SafeNet

# ── Database (SQLite) ────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:safenet.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ──────────────────────────────────────────────────────
# Override JWT_SECRET on any real deployment — this default is fine for
# local dev only. Set it in your host's environment variable settings.
jwt.secret=${JWT_SECRET:SafeNetSecretKey2024HospitalSecureAES256Bits}
jwt.expiry=86400000

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── ML API ───────────────────────────────────────────────────
# Set ML_API_URL to wherever ml_api.py ends up deployed (e.g. your Render
# ML service's URL) — falls back to localhost for local runs.
ml.api.url=${ML_API_URL:http://localhost:5000}

# ── Email (Forgot Password) ─────────────────────────────────
# For Gmail: enable 2-Step Verification on the sending account, then create
# an "App Password" at https://myaccount.google.com/apppasswords — use that
# 16-character app password below, NOT your real Gmail password (Gmail
# rejects plain account passwords for SMTP). Any other SMTP provider
# (Outlook, SendGrid, your college's mail server, etc.) works the same way —
# just change host/port/username/password to match.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# The address reset emails appear to come "from" — most providers require
# this to match spring.mail.username or a verified sender identity.
safenet.mail.from=${MAIL_FROM:your-email@gmail.com}

# Where the reset link in the email should point — wherever you're actually
# serving the frontend from (see safenet.allowed-origins below). Set
# FRONTEND_URL to your deployed frontend's URL (e.g. your Netlify link).
safenet.frontend-url=${FRONTEND_URL:http://localhost:5500}

# ── CORS ─────────────────────────────────────────────────────
# Comma-separated origins allowed to call this API. Set ALLOWED_ORIGINS to
# your deployed frontend's URL once you have it; do NOT use "*" in
# production since allowCredentials is enabled.
# "null" is included because opening the HTML files directly (file://)
# sends "Origin: null" — convenient for local testing, but remove it once
# you're pointing at a real deployed frontend origin.
safenet.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,null}

# ── IoT Monitoring ───────────────────────────────────────────
# Automatically polls bed occupancy and feeds synthetic telemetry through the
# ML anomaly detector every interval-ms. Set enabled=false to disable (e.g.
# if the ML API isn't running) and rely on manual /api/iot/detect calls only.
iot.monitoring.enabled=true
iot.monitoring.interval-ms=30000

# ── Logging ──────────────────────────────────────────────────
logging.level.com.safenet=INFO
logging.level.org.springframework.security=WARN
